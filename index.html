<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Sounds</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .product img {
      width: 100%;
      height: 200px;
      object-fit: contain;
    }

    .product h2 {
      font-size: 20px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>Top Sounds</h1>
  <p>Car Audio & Accessories</p>
</header>

<div class="container">
  <h2>Our Products</h2>

  <div class="products">

    <div class="product">
      <img src="https://via.placeholder.com/400x300?text=Product" alt="Product">
      <h2>Car Audio Product</h2>
      <p>High quality car audio equipment.</p>
      <div class="price">$199.99</div>
    </div>

  </div>
</div>

</body>
</html>
